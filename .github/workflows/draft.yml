name: draft

# 00:45 UTC = 06:15 IST, so the card is waiting on your phone before 07:00 and
# the first publish check at 07:00 IST can act on it. Actions cron can fire 5-30
# minutes late under load, which the 45-minute head start absorbs.
on:
  schedule:
    - cron: "45 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render locally without sending to Telegram"
        type: boolean
        default: false

concurrency:
  group: newsletter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e .
          playwright install --with-deps chromium

      - name: Draft
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CURATE_MODEL: ${{ vars.CURATE_MODEL }}
          WRITE_MODEL: ${{ vars.WRITE_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          BRAND_NAME: ${{ vars.BRAND_NAME }}
          BRAND_HANDLE: ${{ vars.BRAND_HANDLE }}
          STORIES_PER_POST: ${{ vars.STORIES_PER_POST }}
          LEADS_MIN: ${{ vars.LEADS_MIN }}
          LEADS_MAX: ${{ vars.LEADS_MAX }}
          BRIEFS_MAX: ${{ vars.BRIEFS_MAX }}
          DESTINATIONS: ${{ vars.DESTINATIONS }}
        run: |
          python -m newsletter.pipeline draft \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit card and state
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ai-newsletter[bot]"
          git config user.email "noreply@github.com"
          # The card must be committed and public before publish.yml runs:
          # Meta fetches the image URL itself.
          git add out/ state/
          git diff --staged --quiet || git commit -m "draft $(date -u +%Y-%m-%d)"
          git push

      - name: Upload card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ github.run_id }}
          path: out/
          retention-days: 7
          if-no-files-found: ignore
