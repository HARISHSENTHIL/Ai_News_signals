[project]
name = "ai-newsletter"
version = "0.1.0"
description = "Autonomous daily AI-news post for Instagram (and later LinkedIn)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.99",
    "pydantic>=2.9",
    "httpx>=0.27",
    "feedparser>=6.0.11",
    "jinja2>=3.1",
    "playwright>=1.47",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
